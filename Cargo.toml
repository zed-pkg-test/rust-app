[package]
name = "rust-app"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
resolver = "2"
description = "A Rust app combining Zed path packages with Cargo registry dependencies."
license = "MIT"
publish = false
build = "build.rs"

# Zed materializes this package. Cargo then consumes the result as an ordinary
# path dependency with target-specific feature selection.
[dependencies]
rust-lib = { path = ".vendor/.zed/zed-pkg-test/rust-lib", features = ["uppercase"] }
unicode-ident = "=1.0.24"

# Resolver v2 must keep this host build dependency's default feature set
# separate from the target dependency's `uppercase` feature.
[build-dependencies]
rust-lib = { path = ".vendor/.zed/zed-pkg-test/rust-lib", default-features = false }
