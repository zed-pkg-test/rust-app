name: beamscale-phoenix-admin-ingest-proof

on:
  push:
    branches:
      - beamscale-phoenix-admin-ingest-proof-20260925

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Phoenix admin ingest
        run: |
          cargo fmt --manifest-path phoenix-admin-proof/Cargo.toml --all -- --check
          cargo clippy --manifest-path phoenix-admin-proof/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path phoenix-admin-proof/Cargo.toml --all-targets
