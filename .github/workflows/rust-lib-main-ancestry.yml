name: rust-lib main ancestry ratchet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_LIB_REVIEWED_MERGE_REF: 49e3a6bc36bf0f96e971a1edc0c183fd1dcfa55b

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/rust-lib-main-ancestry.yml

      - name: Validate executable scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify-rust-lib-main-ancestry.sh
          bash -n tests/rust-lib-main-ancestry.sh
          [[ "$RUST_LIB_REVIEWED_MERGE_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Prove local negative and positive cases
        run: bash tests/rust-lib-main-ancestry.sh

      - name: Require one shared immutable rust-lib pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_ENV" <<'PY'
          import re
          import sys
          from pathlib import Path

          required = {
              ".github/workflows/zed-e2e.yml",
              ".github/workflows/cargo-workspace-e2e.yml",
          }
          pins = {}
          pattern = re.compile(r"(?m)^  RUST_LIB_REF: ([0-9a-f]{40})$")
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              matches = pattern.findall(path.read_text(encoding="utf-8"))
              if matches:
                  assert len(matches) == 1, f"{path} declares multiple RUST_LIB_REF values"
                  pins[str(path)] = matches[0]
          assert required.issubset(pins), (required, pins)
          assert len(set(pins.values())) == 1, pins
          with Path(sys.argv[1]).open("a", encoding="utf-8") as handle:
              handle.write(f"RUST_LIB_REF={next(iter(pins.values()))}\n")
          PY

      - name: Verify the certified pin reached main through the reviewed merge
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-rust-lib-main-ancestry.sh \
            "$RUNNER_TEMP/rust-lib-main-ancestry.json"

      - name: Upload bounded ancestry evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-lib-main-ancestry
          path: ${{ runner.temp }}/rust-lib-main-ancestry.json
          if-no-files-found: warn
          retention-days: 7
