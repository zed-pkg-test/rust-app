name: generate Cargo interop lock once

on:
  push:
    branches:
      - agent/cargo-zed-interop-matrix
    paths:
      - .github/workflows/generate-cargo-lock-once.yml

permissions:
  contents: write

concurrency:
  group: rust-app-cargo-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact consumer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/cargo-zed-interop-matrix
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Materialize exact Zed package source
        shell: bash
        env:
          RUST_LIB_REF: f3c4e33cd0e5726b2c668c0306936f01674261fa
        run: |
          set -euo pipefail
          target=.vendor/.zed/zed-pkg-test/rust-lib
          mkdir -p "$(dirname "$target")"
          git init -q "$target"
          git -C "$target" remote add origin https://github.com/zed-pkg-test/rust-lib.git
          git -C "$target" fetch --depth 1 origin "$RUST_LIB_REF"
          git -C "$target" checkout -q --detach FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "$RUST_LIB_REF"

      - name: Resolve and validate the exact mixed graph
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text())
          packages = {package["name"]: package for package in metadata["packages"]}
          assert packages["rust-app"]["version"] == "0.2.0"
          assert packages["rust-lib"]["version"] == "1.0.1"
          assert packages["rust-lib"]["source"] is None
          assert packages["itoa"]["version"] == "1.0.18"
          assert packages["unicode-ident"]["version"] == "1.0.24"
          assert packages["itoa"]["source"].startswith("registry+")
          assert packages["unicode-ident"]["source"].startswith("registry+")
          PY
          grep -Fq 'name = "rust-lib"' Cargo.lock
          grep -Fq 'name = "itoa"' Cargo.lock
          grep -Fq 'name = "unicode-ident"' Cargo.lock
          test ! -e .zpkg.lock
          git diff --exit-code -- Cargo.toml .zpkg.toml build.rs src tests

      - name: Commit only the durable Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vendor .zed .zpkg.lock
          git rm .github/workflows/generate-cargo-lock-once.yml
          git add Cargo.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock mixed Cargo and Zed dependency graph'
          git push origin HEAD:agent/cargo-zed-interop-matrix
