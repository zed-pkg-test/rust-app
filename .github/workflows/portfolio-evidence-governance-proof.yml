name: portfolio-evidence-governance-proof

on:
  push:
    branches:
      - portfolio-evidence-governance-proof-20260925

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path portfolio-proof/tools/portfolio-evidence-validator/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path portfolio-proof/tools/portfolio-evidence-validator/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path portfolio-proof/tools/portfolio-evidence-validator/Cargo.toml --all-targets
      - name: Validate exact governed snapshot
        run: cargo run --quiet --manifest-path portfolio-proof/tools/portfolio-evidence-validator/Cargo.toml -- portfolio-proof/governance/portfolio-governance.v1.json
