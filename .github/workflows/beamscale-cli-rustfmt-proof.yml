name: beamscale-cli-rustfmt-proof

on:
  push:
    branches:
      - beamscale-cli-rustfmt-proof-20260925

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt to mirrored BeamScale CLI
        run: cargo fmt --manifest-path beamscale-proof/Cargo.toml --all
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet -- beamscale-proof; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add beamscale-proof
          git commit -m "proof: apply rustfmt to BeamScale CLI"
          git push
