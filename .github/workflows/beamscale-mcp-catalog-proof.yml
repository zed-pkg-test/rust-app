name: beamscale-mcp-catalog-proof

on:
  push:
    branches:
      - beamscale-mcp-catalog-proof-20260926

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check MCP catalog implementation
        run: |
          cargo fmt --manifest-path mcp-proof/Cargo.toml --all -- --check
          cargo clippy --manifest-path mcp-proof/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path mcp-proof/Cargo.toml --all-targets
