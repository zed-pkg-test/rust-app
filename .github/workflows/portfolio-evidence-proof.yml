name: portfolio-evidence-proof

on:
  push:
    branches:
      - portfolio-evidence-proof-20260925

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate governance semantics
        run: |
          cargo fmt --manifest-path portfolio-proof/validator/Cargo.toml --all
          echo "__BMSCL_FORMATTED_VALIDATOR_BEGIN__"
          cat portfolio-proof/validator/src/main.rs
          echo "__BMSCL_FORMATTED_VALIDATOR_END__"
          cargo clippy --manifest-path portfolio-proof/validator/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path portfolio-proof/validator/Cargo.toml
          cargo run --quiet --manifest-path portfolio-proof/validator/Cargo.toml --             portfolio-proof/snapshot/portfolio-governance.v1.json
