name: zed e2e (rust + docker)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_INTERFACES_REF: 61f654d5e4ca718abc4a280a641472466689c278
  ZED_CLI_REF: 359ea72e21027ed54a29fad95b05f38a1ea142c3
  RUST_LIB_REF: d5a0f3d27ace84c36f3229a30bcab65e218d30d2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/zed-e2e.yml

      - name: Validate executable test script
        run: bash -n scripts/zed-e2e.sh

      - name: Run pinned cross-container interoperability suite
        run: bash scripts/zed-e2e.sh
