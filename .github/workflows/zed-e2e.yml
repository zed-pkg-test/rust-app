name: zed e2e (rust + docker)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_INTERFACES_REF: 61f654d5e4ca718abc4a280a641472466689c278
  ZED_CLI_REF: 359ea72e21027ed54a29fad95b05f38a1ea142c3
  RUST_LIB_REF: d5a0f3d27ace84c36f3229a30bcab65e218d30d2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/zed-e2e.yml

      - name: Verify Cargo and Zed metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as handle:
              cargo = tomllib.load(handle)
          with Path(".zpkg.toml").open("rb") as handle:
              zed = tomllib.load(handle)

          package = cargo["package"]
          zed_package = zed["package"]
          assert package["name"] == zed_package["name"]
          assert package["version"] == zed_package["version"]
          assert package["description"] == zed_package["description"]
          assert package["license"] == zed_package["license"]
          assert package["publish"] is False
          assert zed_package["org"] == "zed-pkg-test"
          assert cargo["dependencies"]["rust-lib"]["path"] == ".vendor/.zed/zed-pkg-test/rust-lib"
          assert zed["dependencies"] == {"zed-pkg-test/rust-lib": "^1.0.0"}
          PY

      - name: Prepare immutable Docker build context
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/zed-docker-context"
          mkdir -p "$context"
          clone_at() {
            repo="$1"
            ref="$2"
            destination="$3"
            git init -q "$destination"
            git -C "$destination" remote add origin "$repo"
            git -C "$destination" fetch --depth 1 origin "$ref"
            git -C "$destination" checkout -q --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$ref"
          }
          clone_at https://github.com/zed-pkg/zed-interfaces.git \
            "$ZED_INTERFACES_REF" "$context/zed-interfaces"
          clone_at https://github.com/zed-pkg/zed-cli.git \
            "$ZED_CLI_REF" "$context/zed-cli"

      - name: Build Rust + zed test image
        run: |
          docker build \
            --file .github/docker/Dockerfile \
            --tag zed-pkg-test/rust-e2e:${GITHUB_SHA} \
            "$RUNNER_TEMP/zed-docker-context"

      - name: Fetch and verify the exact rust-lib fixture
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/rust-lib"
          git init -q "$destination"
          git -C "$destination" remote add origin https://github.com/zed-pkg-test/rust-lib.git
          git -C "$destination" fetch --depth 1 origin "$RUST_LIB_REF"
          git -C "$destination" checkout -q --detach FETCH_HEAD
          test "$(git -C "$destination" rev-parse HEAD)" = "$RUST_LIB_REF"
          docker run --rm \
            --volume "$destination:/package:ro" \
            --workdir /package \
            rust:bookworm \
            sh -euc '
              CARGO_TARGET_DIR=/tmp/target cargo test --quiet
              grep -Fq "zed-pkg-test/rust-lib" src/lib.rs
            '

      - name: Publish rust-lib inside Docker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zed-registry" "$RUNNER_TEMP/zed-home"
          docker run --rm \
            --volume "$RUNNER_TEMP/rust-lib:/package:ro" \
            --volume "$RUNNER_TEMP/zed-registry:/registry" \
            --workdir /package \
            zed-pkg-test/rust-e2e:${GITHUB_SHA} \
            zed publish --registry file:///registry --skip-vcs-checks
          test -n "$(find "$RUNNER_TEMP/zed-registry" -type f -print -quit)"

      - name: Symlink install works with its store mounted
        run: |
          rm -rf .vendor/.zed .zed target
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$RUNNER_TEMP/zed-registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg-test/rust-e2e:${GITHUB_SHA} \
            sh -euc '
              zed install \
                --registry file:///registry \
                --home /zed-home \
                --install-mode symlink
              test -L .vendor/.zed/zed-pkg-test/rust-lib
              CARGO_TARGET_DIR=/tmp/target cargo run --quiet
            '

      - name: Symlink install fails without its store mount
        run: |
          if docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            rust:bookworm \
            sh -euc 'CARGO_TARGET_DIR=/tmp/target cargo run --quiet'
          then
            echo "expected the unmounted store-backed symlink to fail"
            exit 1
          fi

      - name: Frozen copy install contains no store symlinks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$RUNNER_TEMP/zed-registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg-test/rust-e2e:${GITHUB_SHA} \
            sh -euc '
              zed install \
                --frozen \
                --registry file:///registry \
                --home /zed-home \
                --install-mode copy
              test ! -L .vendor/.zed/zed-pkg-test/rust-lib
              test -z "$(find .vendor/.zed -type l -print -quit)"
              CARGO_TARGET_DIR=/tmp/target cargo run --quiet
            '

      - name: Copy install runs in a fresh Rust container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            rust:bookworm \
            sh -euc 'CARGO_TARGET_DIR=/tmp/target cargo run --quiet'
