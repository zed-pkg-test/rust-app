name: zed-hex-hardening-proof

on:
  push:
    branches:
      - zed-hex-hardening-proof-20260926

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-cli
          ref: ff7659371d799523252d418fb5f9b9563aae53af
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check zed-hex
        run: cargo check --bin zed-hex-pm --tests
      - name: Test zed-hex
        run: cargo test --bin zed-hex-pm
