name: BeamScale context ABI exact-head certification

on:
  pull_request:
    paths:
      - "certification/beamscale-context-abi/**"
      - ".github/workflows/beamscale-context-abi-cert.yml"

permissions:
  contents: read

jobs:
  exact-head-contracts:
    runs-on: ubuntu-latest
    env:
      BMSCL_LIB_CORE_HEAD: "1c0e5ba53234cf40caf170f96a7a5b91a95377f8"
      BMSCL_PUB_LIB_CORE_HEAD: "0cff101b81c9552e01dcdc05b6c25ec8ca0ab61d"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          gleam-version: "1.18.1"
      - name: Record exact source heads
        run: |
          printf 'bmscl-lib-core=%s\n' "$BMSCL_LIB_CORE_HEAD"
          printf 'bmscl-pub-lib-core=%s\n' "$BMSCL_PUB_LIB_CORE_HEAD"
      - name: Test Rust admission contract
        working-directory: certification/beamscale-context-abi/rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Test Gleam public SDK contract
        working-directory: certification/beamscale-context-abi/gleam
        run: |
          gleam format src
          git diff -- src
          git diff --exit-code -- src
          gleam check --target erlang
          gleam build --target erlang
