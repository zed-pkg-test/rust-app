name: beamscale-compiler-phoenix-binding-proof

on:
  push:
    branches:
      - beamscale-compiler-phoenix-binding-proof-20260925

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check compiler
        run: cargo check --manifest-path compiler-proof/Cargo.toml --all-targets
      - name: Test compiler
        run: cargo test --manifest-path compiler-proof/Cargo.toml --all-targets
      - name: Clippy compiler
        run: cargo clippy --manifest-path compiler-proof/Cargo.toml --all-targets -- -D warnings
