name: beamscale-durable-cli-proof

on:
  push:
    branches:
      - beamscale-durable-cli-proof-20260925

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check CLI
        run: cargo check --manifest-path beamscale-durable-cli-proof/Cargo.toml --all-targets
      - name: Test CLI
        run: cargo test --manifest-path beamscale-durable-cli-proof/Cargo.toml
