[package]
org = "zedtest"
name = "rust-app"
version = "0.1.0"
description = "A Rust app sourcing one crate via zed and the rest via cargo."
license = "MIT"
[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg-test/rust-app"

# zed drops the crate here; cargo picks it up via the path dependency below.
[install]
dir = ".vendor/.zed"

[dependencies]
"zedtest/rust-lib" = "^1.0.0"
