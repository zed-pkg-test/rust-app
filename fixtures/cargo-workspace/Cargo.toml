[workspace]
members = ["crates/app", "crates/support"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
zed-rust-lib = { package = "rust-lib", version = "=1.0.1", default-features = false }
unicode-ident = "=1.0.24"
workspace-support = { path = "crates/support" }
