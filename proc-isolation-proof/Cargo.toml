[package]
name = "ores-proc-isolation-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Fail-closed rootless process isolation for macOS and Linux"
repository = "https://github.com/ORESoftware/ores-proc-isolation-cli"
readme = "README.md"
keywords = ["sandbox", "isolation", "security", "linux", "macos"]
categories = ["command-line-utilities", "os"]

[lib]
name = "ores_proc_isolation"
path = "src/lib.rs"

[[bin]]
name = "ores-proc-isolation"
path = "src/main.rs"

[dependencies]
flags2env = { package = "flags2env", git = "https://github.com/flags-2-env/flags-2-env.git", rev = "3414281ed8d7339d5bfabf951048bff31aa3349e" }
ores-reactive-maps = { path = "vendor/ores-reactive-maps", package = "ores-reactive-maps" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"
